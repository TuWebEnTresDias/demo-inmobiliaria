<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="propOlivos">
  <title id="propOlivos">Ilustración de un dúplex con cochera en Olivos, cerca del río</title>
  <defs>
    <linearGradient id="p6sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D5E6EF"/>
      <stop offset="1" stop-color="#F7F3EB"/>
    </linearGradient>
    <linearGradient id="p6river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FC4DE"/>
      <stop offset="1" stop-color="#5FA8C4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#p6sky)"/>
  <circle cx="672" cy="96" r="44" fill="#E9C46A"/>
  <!-- river band -->
  <rect y="524" width="800" height="76" fill="url(#p6river)"/>
  <g stroke="#A8DCEC" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M90 556 q16 -8 32 0 q16 8 32 0"/>
    <path d="M320 580 q16 -8 32 0 q16 8 32 0"/>
    <path d="M560 560 q16 -8 32 0 q16 8 32 0"/>
  </g>
  <!-- malecón edge -->
  <rect y="516" width="800" height="12" fill="#B7D6BD"/>
  <!-- duplex -->
  <rect x="230" y="250" width="200" height="266" fill="#F6F1E7"/>
  <rect x="430" y="310" width="150" height="206" fill="#EFE7D8"/>
  <rect x="230" y="250" width="200" height="266" fill="none" stroke="#D8CDBA" stroke-width="4"/>
  <rect x="430" y="310" width="150" height="206" fill="none" stroke="#D8CDBA" stroke-width="4"/>
  <!-- roofs -->
  <rect x="214" y="228" width="232" height="28" rx="8" fill="#14532D"/>
  <rect x="418" y="288" width="174" height="26" rx="8" fill="#14532D"/>
  <!-- windows left volume -->
  <g fill="#8CC9AC" stroke="#0E5A43" stroke-width="4">
    <rect x="262" y="284" width="64" height="64" rx="4"/>
    <rect x="352" y="284" width="64" height="64" rx="4"/>
    <rect x="262" y="386" width="64" height="64" rx="4"/>
  </g>
  <!-- terrace right volume -->
  <g fill="#8CC9AC" stroke="#0E5A43" stroke-width="4">
    <rect x="458" y="344" width="94" height="60" rx="4"/>
  </g>
  <g stroke="#C9A227" stroke-width="4" stroke-linecap="round">
    <line x1="452" y1="338" x2="452" y2="310"/>
    <line x1="480" y1="338" x2="480" y2="310"/>
    <line x1="508" y1="338" x2="508" y2="310"/>
    <line x1="536" y1="338" x2="536" y2="310"/>
    <line x1="564" y1="338" x2="564" y2="310"/>
    <line x1="446" y1="316" x2="574" y2="316"/>
  </g>
  <!-- garage door -->
  <rect x="452" y="428" width="106" height="88" rx="6" fill="#CBD9CE"/>
  <g stroke="#AFC6B4" stroke-width="4">
    <line x1="452" y1="452" x2="558" y2="452"/>
    <line x1="452" y1="478" x2="558" y2="478"/>
    <line x1="452" y1="502" x2="558" y2="502"/>
  </g>
  <!-- door left volume -->
  <rect x="352" y="436" width="64" height="80" rx="6" fill="#C9A227"/>
  <!-- trees -->
  <rect x="140" y="420" width="14" height="96" rx="5" fill="#8B5E34"/>
  <circle cx="147" cy="382" r="46" fill="#2E7D5B"/>
  <circle cx="122" cy="408" r="28" fill="#3FA37A"/>
  <circle cx="660" cy="452" r="28" fill="#379070"/>
  <rect x="654" y="476" width="12" height="40" rx="4" fill="#8B5E34"/>
  <!-- sailboat -->
  <g>
    <path d="M60 512 l0 -52 l40 52 z" fill="#F6F1E7"/>
    <path d="M56 512 l0 -40 l-30 40 z" fill="#E9C46A"/>
    <line x1="60" y1="456" x2="60" y2="516" stroke="#14532D" stroke-width="4"/>
    <path d="M34 520 q26 12 52 0 l-8 16 q-18 8 -36 0 z" fill="#0E5A43"/>
  </g>
</svg>
