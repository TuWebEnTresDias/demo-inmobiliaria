<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="propSanisidro">
  <title id="propSanisidro">Ilustración de una casa con jardín y pileta en San Isidro</title>
  <defs>
    <linearGradient id="p3sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D5E6EF"/>
      <stop offset="1" stop-color="#F7F3EB"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#p3sky)"/>
  <circle cx="668" cy="100" r="44" fill="#E9C46A"/>
  <!-- ground -->
  <rect y="480" width="800" height="120" fill="#BFD8C0"/>
  <rect y="480" width="800" height="10" fill="#A9C8AC"/>
  <!-- house -->
  <rect x="230" y="240" width="340" height="240" fill="#F6F1E7"/>
  <rect x="230" y="240" width="340" height="240" fill="none" stroke="#D8CDBA" stroke-width="4"/>
  <!-- pitched roof -->
  <polygon points="200,250 400,150 600,250" fill="#0E5A43"/>
  <polygon points="200,250 400,150 600,250" fill="none" stroke="#14532D" stroke-width="6" stroke-linejoin="round"/>
  <!-- chimney -->
  <rect x="500" y="168" width="34" height="64" fill="#B7A26A"/>
  <!-- windows -->
  <g fill="#8CC9AC" stroke="#0E5A43" stroke-width="4">
    <rect x="266" y="290" width="80" height="76" rx="5"/>
    <rect x="454" y="290" width="80" height="76" rx="5"/>
  </g>
  <g stroke="#0E5A43" stroke-width="4">
    <line x1="306" y1="290" x2="306" y2="366"/>
    <line x1="494" y1="290" x2="494" y2="366"/>
  </g>
  <!-- door -->
  <rect x="372" y="360" width="66" height="120" rx="6" fill="#C9A227"/>
  <circle cx="424" cy="424" r="5" fill="#8A6D14"/>
  <!-- pool -->
  <rect x="560" y="470" width="180" height="86" rx="14" fill="#7FC4DE"/>
  <rect x="560" y="470" width="180" height="86" rx="14" fill="none" stroke="#5FA8C4" stroke-width="5"/>
  <g stroke="#A8DCEC" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M582 500 q14 -8 28 0 q14 8 28 0"/>
    <path d="M642 528 q14 -8 28 0 q14 8 28 0"/>
  </g>
  <!-- garden trees -->
  <rect x="120" y="420" width="14" height="70" rx="5" fill="#8B5E34"/>
  <circle cx="127" cy="386" r="46" fill="#2E7D5B"/>
  <circle cx="103" cy="410" r="28" fill="#3FA37A"/>
  <rect x="700" y="410" width="12" height="60" rx="5" fill="#8B5E34"/>
  <circle cx="706" cy="380" r="40" fill="#379070"/>
  <!-- bushes near house -->
  <circle cx="262" cy="486" r="20" fill="#3FA37A"/>
  <circle cx="296" cy="492" r="16" fill="#2E7D5B"/>
  <circle cx="540" cy="488" r="18" fill="#3FA37A"/>
  <!-- path -->
  <polygon points="380,600 440,600 420,480 392,480" fill="#EAE0CB"/>
</svg>
