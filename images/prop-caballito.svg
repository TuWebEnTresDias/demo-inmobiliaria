<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="propCaballito">
  <title id="propCaballito">Ilustración de un PH con terraza propia en Caballito</title>
  <defs>
    <linearGradient id="p2sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEDE2"/>
      <stop offset="1" stop-color="#F7F3EB"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#p2sky)"/>
  <circle cx="140" cy="110" r="46" fill="#E9C46A"/>
  <!-- neighbor building background -->
  <rect x="80" y="200" width="150" height="350" fill="#E3DAC8"/>
  <rect x="570" y="230" width="150" height="320" fill="#E3DAC8"/>
  <g fill="#C9BFA8">
    <rect x="104" y="230" width="40" height="46" rx="3"/>
    <rect x="166" y="230" width="40" height="46" rx="3"/>
    <rect x="104" y="306" width="40" height="46" rx="3"/>
    <rect x="166" y="306" width="40" height="46" rx="3"/>
    <rect x="594" y="262" width="40" height="46" rx="3"/>
    <rect x="656" y="262" width="40" height="46" rx="3"/>
    <rect x="594" y="338" width="40" height="46" rx="3"/>
    <rect x="656" y="338" width="40" height="46" rx="3"/>
  </g>
  <!-- PH house -->
  <rect x="280" y="300" width="240" height="250" fill="#F6F1E7"/>
  <rect x="280" y="300" width="240" height="250" fill="none" stroke="#D8CDBA" stroke-width="4"/>
  <!-- terrace floor -->
  <rect x="264" y="284" width="272" height="20" rx="6" fill="#B7A26A"/>
  <!-- terrace railing -->
  <g stroke="#C9A227" stroke-width="5" stroke-linecap="round">
    <line x1="276" y1="284" x2="276" y2="240"/>
    <line x1="310" y1="284" x2="310" y2="240"/>
    <line x1="344" y1="284" x2="344" y2="240"/>
    <line x1="378" y1="284" x2="378" y2="240"/>
    <line x1="412" y1="284" x2="412" y2="240"/>
    <line x1="446" y1="284" x2="446" y2="240"/>
    <line x1="480" y1="284" x2="480" y2="240"/>
    <line x1="514" y1="284" x2="514" y2="240"/>
    <line x1="266" y1="248" x2="524" y2="248"/>
  </g>
  <!-- terrace furniture -->
  <rect x="430" y="252" width="56" height="14" rx="4" fill="#2E7D5B"/>
  <circle cx="470" cy="240" r="10" fill="#3FA37A"/>
  <!-- ground floor -->
  <rect x="308" y="380" width="86" height="170" fill="#8CC9AC" rx="4"/>
  <g stroke="#0E5A43" stroke-width="4">
    <line x1="351" y1="380" x2="351" y2="550"/>
    <line x1="308" y1="452" x2="394" y2="452"/>
  </g>
  <rect x="420" y="440" width="76" height="110" rx="6" fill="#C9A227"/>
  <circle cx="478" cy="498" r="5" fill="#8A6D14"/>
  <!-- stairs side -->
  <g fill="#D8CDBA">
    <rect x="256" y="510" width="24" height="40"/>
    <rect x="256" y="470" width="24" height="40"/>
    <rect x="256" y="430" width="24" height="40"/>
  </g>
  <!-- plants -->
  <circle cx="560" cy="530" r="26" fill="#2E7D5B"/>
  <rect x="552" y="552" width="16" height="28" rx="4" fill="#B7A26A"/>
  <!-- sidewalk -->
  <rect y="550" width="800" height="50" fill="#D9E4D3"/>
</svg>
